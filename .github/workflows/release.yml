name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - name: Set up Java 17 for compatibility tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: sbt/setup-sbt@v1
      - name: Verify the release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Release tag must be vMAJOR.MINOR.PATCH or a SemVer prerelease tag: $RELEASE_TAG" >&2
            exit 1
          fi
          git fetch origin main
          git merge-base --is-ancestor "$RELEASE_TAG" origin/main
      - name: Run unit and scripted tests
        run: sbt -batch '+test' '+scripted'
      - name: Stop the test sbt server
        run: sbt shutdownall
      - name: Set up Java 25 for publishing
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Publish to Maven Central
        run: sbt -batch ci-release
        env:
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
