name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: sbt/setup-sbt@v1
      - name: Check Scala formatting and lint rules
        run: sbt -batch '+scalafix --check' '+scalafmtCheckAll'
      - name: Run unit tests
        run: sbt -batch '+test'

  scripted:
    name: Scripted / Scala ${{ matrix.scala }} / sbt ${{ matrix.sbt }} / JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - scala: 2.12.21
            sbt: 1.3.13
            java: '17'
          - scala: 2.12.21
            sbt: 1.4.0
            java: '17'
          - scala: 2.12.21
            sbt: 1.8.3
            java: '17'
          - scala: 2.12.21
            sbt: 1.12.14
            java: '25'
          - scala: 3.8.4
            sbt: 2.0.4
            java: '25'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: sbt/setup-sbt@v1
      - name: Run scripted tests
        run: sbt -batch '++${{ matrix.scala }}' 'set scriptedSbt := "${{ matrix.sbt }}"' 'scripted basic/*'
