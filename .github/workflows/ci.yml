name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: sbt/setup-sbt@v1
      - name: Check Scala formatting and lint rules
        run: sbt -batch "; scalafix --check; scalafmtCheckAll"
      - name: Run unit and scripted tests
        run: sbt -batch "; test; scripted"
